# Plain (non-secret) settings for the API and worker on Cloud Run. Secrets are NOT here: they come from Secret
# Manager through deploy/gcp/secrets.txt. Edit the values to match the live setup; the workflow adds
# JOBS_ENABLED=false on the API and runs the jobs in the worker service.
NODE_ENV: production
TRUST_PROXY: "1"
CLIENT_URL: https://app.example.com
JWT_ACCESS_EXPIRES_IN: 15m
JWT_REFRESH_EXPIRES_IN: 7d
QUEUE_PREFIX: marichihr
PAYROLL_CONCURRENCY: "8"

# Email (Mandrill over SMTP)
EMAIL_TRANSPORT: smtp
SMTP_HOST: smtp.mandrillapp.com
SMTP_PORT: "587"
SMTP_SECURE: "false"
SMTP_FROM: hello@marichisolutions.com
SMTP_FROM_NAME: MarichiHR
NOTIFY_CHANNELS: inapp,email

# Files: Cloud Storage through its S3-compatible XML API (HMAC key of the service account)
STORAGE_PROVIDER: s3
S3_ENDPOINT: https://storage.googleapis.com
S3_REGION: auto
S3_BUCKET: marichihr-documents

# Off until decided
GOOGLE_SIGNIN_ENABLED: "false"
PUSH_ENABLED: "false"
FILING_MODE: sandbox
DIGITAX_LIVE: "false"
WHATSAPP_TEMPLATE_LANG: en
