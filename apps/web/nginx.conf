# Static web app: single-page routes fall back to index.html (same rules as vercel.json)
server {
  listen 8080;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; }
  location = /manifest.webmanifest { default_type application/manifest+json; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; }
}
